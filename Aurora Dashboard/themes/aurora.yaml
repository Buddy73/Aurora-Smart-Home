Aurora:
  # Project Polaris — approved Aurora Midnight × Nordic Premium direction.
  primary-color: "#5B8CFF"
  accent-color: "#6FE8FF"
  dark-primary-color: "#3E67CC"
  light-primary-color: "#8EABFF"
  primary-background-color: "#061126"
  secondary-background-color: "#0A1831"
  card-background-color: "linear-gradient(145deg, rgba(54, 78, 122, 0.78) 0%, rgba(20, 39, 71, 0.72) 54%, rgba(10, 24, 49, 0.78) 100%)"
  ha-card-background: "radial-gradient(circle at 84% 8%, rgba(111, 232, 255, 0.095), transparent 38%), linear-gradient(145deg, rgba(54, 78, 122, 0.78) 0%, rgba(20, 39, 71, 0.72) 54%, rgba(10, 24, 49, 0.78) 100%)"
  clear-background-color: "rgba(6, 17, 38, 0)"

  # Rounded, friendly typography with dependency-free fallbacks.
  primary-font-family: '"Nunito Sans", "Avenir Next Rounded", "Trebuchet MS", ui-rounded, system-ui, sans-serif'
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "ui-monospace, SFMono-Regular, Consolas, monospace"
  primary-text-color: "rgba(250, 252, 255, 0.96)"
  secondary-text-color: "rgba(222, 235, 249, 0.76)"
  disabled-text-color: "rgba(222, 235, 249, 0.38)"

  # Smoked crystal glass and floating depth.
  divider-color: "rgba(193, 226, 255, 0.14)"
  outline-color: "rgba(193, 226, 255, 0.20)"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(193, 226, 255, 0.28)"
  ha-card-border-radius: "20px"
  ha-card-box-shadow: "0 22px 54px rgba(1, 6, 19, 0.38), 0 8px 30px rgba(91, 140, 255, 0.075), inset 0 1px 0 rgba(255, 255, 255, 0.17)"
  code-editor-background-color: "#040C1D"
  scrollbar-thumb-color: "rgba(193, 226, 255, 0.24)"

  # Icons and semantic states.
  state-icon-color: "rgba(222, 235, 249, 0.74)"
  state-icon-active-color: "#6FE8FF"
  state-icon-unavailable-color: "rgba(222, 235, 249, 0.30)"
  paper-item-icon-color: "rgba(222, 235, 249, 0.74)"
  paper-item-icon-active-color: "#6FE8FF"
  state-light-active-color: "#FFBB5C"
  state-climate-cool-color: "#6FE8FF"
  state-climate-heat-color: "#FF8F66"
  state-cover-active-color: "#A860FF"
  state-media-player-active-color: "#A860FF"

  # Navigation remains calm; active state carries the Aurora identity.
  sidebar-background-color: "rgba(4, 13, 31, 0.90)"
  sidebar-text-color: "rgba(222, 235, 249, 0.80)"
  sidebar-icon-color: "rgba(222, 235, 249, 0.68)"
  sidebar-selected-background-color: "linear-gradient(90deg, rgba(57, 198, 255, 0.24), rgba(168, 96, 255, 0.24))"
  sidebar-selected-text-color: "#FFFFFF"
  sidebar-selected-icon-color: "#6FE8FF"
  app-header-background-color: "rgba(4, 13, 31, 0.88)"
  app-header-text-color: "rgba(250, 252, 255, 0.96)"

  # Controls.
  switch-checked-color: "#5B8CFF"
  switch-checked-button-color: "#FFFFFF"
  switch-checked-track-color: "#5B8CFF"
  slider-color: "#6FE8FF"
  slider-secondary-color: "rgba(91, 140, 255, 0.30)"
  label-badge-background-color: "rgba(20, 39, 71, 0.88)"
  label-badge-text-color: "rgba(250, 252, 255, 0.96)"

  # Public Aurora design tokens.
  aurora-midnight: "#061126"
  aurora-blue: "#5B8CFF"
  aurora-cyan: "#6FE8FF"
  aurora-emerald: "#48E0B0"
  aurora-purple: "#A860FF"
  aurora-amber: "#FFBB5C"
  aurora-danger: "#FF647E"
  aurora-surface: "rgba(20, 39, 71, 0.72)"
  aurora-surface-top: "rgba(54, 78, 122, 0.78)"
  aurora-glass: "rgba(20, 39, 71, 0.68)"
  aurora-glass-raised: "rgba(61, 82, 132, 0.80)"
  aurora-glass-border: "rgba(193, 226, 255, 0.28)"
  aurora-glass-highlight: "rgba(255, 255, 255, 0.17)"
  aurora-glass-reflection: "linear-gradient(118deg, rgba(255, 255, 255, 0.16) 0%, rgba(111, 232, 255, 0.06) 24%, transparent 49%)"
  aurora-glass-ambient: "radial-gradient(circle at 84% 8%, rgba(111, 232, 255, 0.095), transparent 38%)"
  aurora-glass-blur: "18px"
  aurora-glass-saturation: "132%"
  aurora-gradient-primary: "linear-gradient(145deg, #061126 0%, #102952 52%, #061126 100%)"
  aurora-gradient-energy: "linear-gradient(145deg, #061126 0%, #0A3437 52%, #061126 100%)"
  aurora-gradient-climate: "linear-gradient(145deg, #061126 0%, #0B3140 54%, #061126 100%)"
  aurora-gradient-media: "linear-gradient(145deg, #061126 0%, #25204D 54%, #061126 100%)"
  aurora-radius-sm: "14px"
  aurora-radius-card: "20px"
  aurora-radius-hero: "26px"
  aurora-space-1: "4px"
  aurora-space-2: "8px"
  aurora-space-3: "12px"
  aurora-space-4: "16px"
  aurora-space-6: "24px"
  aurora-space-8: "32px"
  aurora-shadow-card: "0 22px 54px rgba(1, 6, 19, 0.38), 0 8px 30px rgba(91, 140, 255, 0.075), inset 0 1px 0 rgba(255, 255, 255, 0.17)"
  aurora-shadow-raised: "0 32px 78px rgba(1, 6, 19, 0.44), 0 14px 42px rgba(168, 96, 255, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.19)"
  aurora-shadow-pressed: "0 8px 24px rgba(1, 6, 19, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.09)"
  aurora-transition-fast: "180ms ease"
  aurora-glow-energy: "0 18px 44px rgba(111, 232, 255, 0.11)"
  aurora-glow-climate: "0 18px 44px rgba(72, 224, 176, 0.10)"
  aurora-glow-media: "0 18px 44px rgba(168, 96, 255, 0.12)"
  aurora-glow-camera: "0 18px 44px rgba(91, 140, 255, 0.10)"
  aurora-glow-hobby: "0 18px 44px rgba(255, 187, 92, 0.09)"

  modes:
    dark:
      primary-background-color: "#061126"
      secondary-background-color: "#0A1831"
      card-background-color: "linear-gradient(145deg, rgba(54, 78, 122, 0.78) 0%, rgba(20, 39, 71, 0.72) 54%, rgba(10, 24, 49, 0.78) 100%)"
      ha-card-background: "radial-gradient(circle at 84% 8%, rgba(111, 232, 255, 0.095), transparent 38%), linear-gradient(145deg, rgba(54, 78, 122, 0.78) 0%, rgba(20, 39, 71, 0.72) 54%, rgba(10, 24, 49, 0.78) 100%)"
      primary-text-color: "rgba(250, 252, 255, 0.96)"
      secondary-text-color: "rgba(222, 235, 249, 0.76)"
      app-header-background-color: "rgba(4, 13, 31, 0.88)"
      sidebar-background-color: "rgba(4, 13, 31, 0.90)"
