Aurora:
  # Core palette
  primary-color: "#2F6FFF"
  accent-color: "#39C6FF"
  dark-primary-color: "#2457CC"
  light-primary-color: "#6E95FF"
  primary-background-color: "#0B1020"
  secondary-background-color: "#10182B"
  card-background-color: "rgba(18, 27, 48, 0.82)"
  ha-card-background: "rgba(18, 27, 48, 0.82)"
  clear-background-color: "rgba(11, 16, 32, 0)"

  # Typography
  primary-font-family: "Inter, Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "ui-monospace, SFMono-Regular, Consolas, monospace"
  primary-text-color: "rgba(255, 255, 255, 0.94)"
  secondary-text-color: "rgba(255, 255, 255, 0.68)"
  disabled-text-color: "rgba(255, 255, 255, 0.38)"

  # Surfaces, borders and elevation
  divider-color: "rgba(255, 255, 255, 0.10)"
  outline-color: "rgba(255, 255, 255, 0.12)"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255, 255, 255, 0.10)"
  ha-card-border-radius: "18px"
  ha-card-box-shadow: "0 10px 30px rgba(0, 0, 0, 0.24)"
  code-editor-background-color: "#080D19"
  scrollbar-thumb-color: "rgba(255, 255, 255, 0.20)"

  # Icons and states
  state-icon-color: "rgba(255, 255, 255, 0.64)"
  state-icon-active-color: "#39C6FF"
  state-icon-unavailable-color: "rgba(255, 255, 255, 0.28)"
  paper-item-icon-color: "rgba(255, 255, 255, 0.64)"
  paper-item-icon-active-color: "#39C6FF"
  state-light-active-color: "#FFB347"
  state-climate-cool-color: "#39C6FF"
  state-climate-heat-color: "#FF8A4C"
  state-cover-active-color: "#7A5CFF"
  state-media-player-active-color: "#7A5CFF"

  # Sidebar and navigation
  sidebar-background-color: "#080D19"
  sidebar-text-color: "rgba(255, 255, 255, 0.72)"
  sidebar-icon-color: "rgba(255, 255, 255, 0.58)"
  sidebar-selected-background-color: "rgba(47, 111, 255, 0.16)"
  sidebar-selected-text-color: "#FFFFFF"
  sidebar-selected-icon-color: "#39C6FF"
  app-header-background-color: "rgba(8, 13, 25, 0.92)"
  app-header-text-color: "rgba(255, 255, 255, 0.94)"

  # Controls
  switch-checked-color: "#2F6FFF"
  switch-checked-button-color: "#FFFFFF"
  switch-checked-track-color: "#2F6FFF"
  slider-color: "#2F6FFF"
  slider-secondary-color: "rgba(47, 111, 255, 0.28)"
  label-badge-background-color: "rgba(18, 27, 48, 0.88)"
  label-badge-text-color: "rgba(255, 255, 255, 0.94)"

  # Aurora semantic tokens
  aurora-midnight: "#0B1020"
  aurora-blue: "#2F6FFF"
  aurora-cyan: "#39C6FF"
  aurora-emerald: "#2ED573"
  aurora-purple: "#7A5CFF"
  aurora-amber: "#FFB347"
  aurora-danger: "#FF5F6D"
  aurora-glass: "rgba(255, 255, 255, 0.08)"
  aurora-glass-raised: "rgba(255, 255, 255, 0.11)"
  aurora-glass-border: "rgba(255, 255, 255, 0.10)"
  aurora-gradient-primary: "linear-gradient(145deg, #0B1020 0%, #101B38 52%, #0B1020 100%)"
  aurora-gradient-energy: "linear-gradient(145deg, #0B1020 0%, #0C2A25 52%, #0B1020 100%)"
  aurora-gradient-climate: "linear-gradient(145deg, #0B1020 0%, #0B2730 54%, #0B1020 100%)"
  aurora-radius-sm: "12px"
  aurora-radius-card: "18px"
  aurora-radius-hero: "22px"
  aurora-space-1: "4px"
  aurora-space-2: "8px"
  aurora-space-3: "12px"
  aurora-space-4: "16px"
  aurora-space-6: "24px"
  aurora-space-8: "32px"
  aurora-shadow-card: "0 10px 30px rgba(0, 0, 0, 0.24)"
  aurora-shadow-raised: "0 16px 44px rgba(0, 0, 0, 0.32)"

  modes:
    dark:
      primary-background-color: "#0B1020"
      secondary-background-color: "#10182B"
      card-background-color: "rgba(18, 27, 48, 0.82)"
      ha-card-background: "rgba(18, 27, 48, 0.82)"
      primary-text-color: "rgba(255, 255, 255, 0.94)"
      secondary-text-color: "rgba(255, 255, 255, 0.68)"
      app-header-background-color: "rgba(8, 13, 25, 0.92)"
      sidebar-background-color: "#080D19"
